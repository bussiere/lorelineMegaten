r\",\n      hp: 170,\n      mp: 35,\n      str: 42,\n      mag: 18,\n      agi: 34,\n      luck: 24,\n      xpValue: 80,\n      rewardValue: 55,\n      ai: \"smart\",\n      skills: [\"attack\"],\n      affinity: {\n        phys: \"normal\",\n        fire: \"normal\",\n        ice: \"normal\",\n        elec: \"weak\",\n        force: \"normal\",\n        light: \"normal\",\n        dark: \"normal\"\n      }\n    },\n\n    // Escort B — the reason to kill the escort first. It has Dia, so it will\n    // heal the Commander back over the 45% threshold and stretch the fight;\n    // weak to force, so the party can remove it fast if it chooses to.\n    goblin_mage: {\n      name: \"Goblin Mage\",\n      hp: 130,\n      mp: 90,\n      str: 20,\n      mag: 52,\n      agi: 46,\n      luck: 30,\n      xpValue: 110,\n      rewardValue: 70,\n      ai: \"smart\",\n      skills: [\"attack\", \"agi\", \"zio\", \"dia\"],\n      affinity: {\n        phys: \"normal\",\n        fire: \"resist\",\n        ice: \"normal\",\n        elec: \"normal\",\n        force: \"weak\",\n        light: \"normal\",\n        dark: \"normal\"\n      }\n    },\n\n    // ENCOUNTER 2 — the solo boss, and the stress test of the icon economy.\n    //\n    // Alone, Nue would get one icon per round against the party's four; the\n    // encounter grants it `enemyBonusPress: 2` instead of inflating its stats.\n    // Its defenses do the rest: phys NULL (two icons burned) and elec DRAIN\n    // (whole turn destroyed, boss healed) punish the party's two most reflexive\n    // openers, Oni's Attack and Pixie's Zio.\n    //\n    // The single force weakness is the intended answer, but note that NO party\n    // template above currently carries Zan: as shipped, this fight has no\n    // weakness the player can actually hit, so it plays as a long grind on\n    // fire/ice/light/dark while dodging the two punishing elements. Give one\n    // party member `zan` (or hand Nue a weakness the roster covers) to restore\n    // the intended read-and-exploit loop.\n    nue: {\n      name: \"Nue\",\n      hp: 650,\n      mp: 120,\n      str: 48,\n      mag: 50,\n      agi: 42,\n      luck: 36,\n      xpValue: 350,\n      rewardValue: 250,\n      ai: \"smart\",\n      skills: [\"attack\", \"heavy_strike\", \"zio\", \"zan\", \"sukunda\"],\n      affinity: {\n        phys: \"null\",\n        fire: \"normal\",\n        ice: \"normal\",\n        elec: \"drain\",\n        force: \"weak\",\n        light: \"normal\",\n        dark: \"normal\"\n      }\n    }\n  }\n","data/skills.lor":"// ============================================================================\n// SKILL DATABASE\n// ============================================================================\n\n//\n// Content only — the engine reads these fields and nothing else:\n//\n//   kind   damage | heal | stage        which resolver in engine/combat.lor runs\n//   target enemy | ally | self          which target list the UI offers\n//   element phys | fire | ice | elec | force | light | dark | almighty\n//   power  flat base, added to the caster's STR (phys) or MAG (everything else)\n//   mp     the second currency: icons buy actions, MP buys *good* actions\n//   crit   base critical rate, only meaningful for phys (or magicCanCrit)\n//\n// Design shape of the list below: one free-forever basic attack, one expensive\n// physical hammer, one cheap spell per element, plus heal and the six buff /\n// debuff stages. The elemental spells are deliberately identical in cost and\n// power — the choice between them is never about numbers, only about reading\n// the enemy's affinity, which is the decision the whole game is built around.\n//\n\n\nfunction loadSkillDatabase()\n  skillDb = {\n    // The fallback everyone owns: 0 MP, so a party out of resources can always\n    // act. Its higher base crit rate is what keeps it relevant late — it is the\n    // only free way to earn a bonus half-icon.\n    attack: {\n      name: \"Attack\",\n      kind: \"damage\",\n      target: \"enemy\",\n      element: \"phys\",\n      power: 34,\n      mp: 0,\n      crit: 8,\n      magicCanCrit: false\n    },\n\n    // Physical burst: triple the power and the best crit rate, paid for in MP.\n    // The finisher of choice for an Overkill attempt on a Commander.\n    heavy_strike: {\n      name: \"Heavy Strike\",\n      kind: \"damage\",\n      target: \"enemy\",\n      element: \"phys\",\n      power: 100,\n      mp: 12,\n      crit: 14,\n      magicCanCrit: false\n    },\n\n    // The six elemental spells are intentionally interchangeable in cost and\n    // power (42 / 4 MP, no crit). They exist so that \"which element?\" is a\n    // question about the *target*, never about the spell.\n    agi: {\n      name: \"Agi\",\n      kind: \"damage\",\n      target: \"enemy\",\n      element: \"fire\",\n      power: 42,\n      mp: 4,\n      crit: 0,\n      magicCanCrit: false\n    },\n\n    bufu: {\n      name: \"Bufu\",\n      kind: \"damage\",\n      target: \"enemy\",\n      element: \"ice\",\n      power: 42,\n      mp: 4,\n      crit: 0,\n      magicCanCrit: false\n    },\n\n    zio: {\n      name: \"Zio\",\n      kind: \"damage\",\n      target: \"enemy\",\n      element: \"elec\",\n      power: 42,\n      mp: 4,\n      crit: 0,\n      magicCanCrit: false\n    },\n\n    zan: {\n      name: \"Zan\",\n      kind: \"damage\",\n      target: \"enemy\",\n      element: \"force\",\n      power: 42,\n      mp: 4,\n      crit: 0,\n      magicCanCrit: false\n    },\n\n    // Light and dark cost slightly more: in this roster they are the rarest\n    // resistances, so they are the most reliable weakness probes.\n    hama: {\n      name: \"Hama\",\n      kind: \"damage\",\n      target: \"enemy\",\n      element: \"light\",\n      power: 44,\n      mp: 5,\n      crit: 0,\n      magicCanCrit: false\n    },\n\n    mudo: {\n      name: \"Mudo\",\n      kind: \"damage\",\n      target: \"enemy\",\n      element: \"dark\",\n      power: 44,\n      mp: 5,\n      crit: 0,\n      magicCanCrit: false\n    },\n\n    // Healing scales off MAG at 0.8 — worthwhile for a caster, nearly a flat\n    // top-up for a bruiser. It costs a full icon and earns no bonus, so it is\n    // always a tempo loss traded for survival.\n    dia: {\n      name: \"Dia\",\n      kind: \"heal\",\n      target: \"ally\",\n      power: 55,\n      mp: 5,\n      crit: 0,\n      magicCanCrit: false\n    },\n\n    // The stage skills: +1 for the caster's side (…kaja), -1 for the enemy\n    // (…nda), same cost, same clamped ladder. Because both write to the same\n    // stat stage, buffing an ally and debuffing its opponent are strictly\n    // equivalent in effect — the choice is about who survives to benefit.\n    //\n    // Sukukaja/Sukunda are the sleeper picks: AGI drives turn ORDER as well as\n    // accuracy, so they rearrange who gets offered the side's icons.\n    tarukaja: {\n      name: \"Tarukaja\",\n      kind: \"stage\",\n      target: \"ally\",\n      stat: \"attack\",\n      stages: 1,\n      power: 0,\n      mp: 6,\n      crit: 0,\n      magicCanCrit: false\n    },\n\n    rakukaja: {\n      name: \"Rakukaja\",\n      kind: \"stage\",\n      target: \"ally\",\n      stat: \"defense\",\n      stages: 1,\n      power: 0,\n      mp: 6,\n      crit: 0,\n      magicCanCrit: false\n    },\n\n    sukukaja: {\n      name: \"Sukukaja\",\n      kind: \"stage\",\n      target: \"ally\",\n      stat: \"agility\",\n      stages: 1,\n      power: 0,\n      mp: 6,\n      crit: 0,\n      magicCanCrit: false\n    },\n\n    tarunda: {\n      name: \"Tarunda\",\n      kind: \"stage\",\n      target: \"enemy\",\n      stat: \"attack\",\n      stages: -1,\n      power: 0,\n      mp: 6,\n      crit: 0,\n      magicCanCrit: false\n    },\n\n    rakunda: {\n      name: \"Rakunda\",\n      kind: \"stage\",\n      target: \"enemy\",\n      stat: \"defense\",\n      stages: -1,\n      power: 0,\n      mp: 6,\n      crit: 0,\n      magicCanCrit: false\n    },\n\n    sukunda: {\n      name: \"Sukunda\",\n      kind: \"stage\",\n      target: \"enemy\",\n      stat: \"agility\",\n      stages: -1,\n      power: 0,\n      mp: 6,\n      crit: 0,\n      magicCanCrit: false\n    }\n  }\n","data/registry.lor":"// ============================================================================\n// DATABASE REGISTRY\n// ============================================================================\n\n//\n// One boot call for every content database, invoked from `beat Start` before\n// any encounter. Order is free — the databases do not reference each other,\n// they are only cross-referenced at runtime by id (an encounter names actor\n// templates, a template names skill ids).\n//\n\n\nfunction initializeDatabases()\n  loadCombatRules()\n  loadSkillDatabase()\n  loadActorDatabase()\n  loadEncounterDatabase()\n","data/encounters.lor":"// ============================================================================\n// ENCOUNTER DATABASE\n// ============================================================================\n//\n// commanderSlot points to the enemyTeam array slot.\n//\n// Example:\n// enemyTeam: [\"goblin_commander\", \"goblin_soldier\", \"goblin_mage\"]\n// commanderSlot: 0\n//\n// As soon as enemy slot 0 reaches HP <= 0, battle ends immediately.\n//\n\n// An encounter is the whole difficulty statement of a fight: who is on each\n// side (order matters — it is the UI slot order), who commands, and how many\n// bonus icons each side opens with.\n//\n// `playerBonusPress` / `enemyBonusPress` are the preferred boss dial: adding\n// an icon changes how often a side acts, which is felt turn by turn, whereas\n// adding HP only makes the same fight longer.\n//\n\n\nfunction loadEncounterDatabase()\n  encounterDb = {\n    // Three enemies, so the enemy side opens with 3 icons against the party's\n    // 4. `commanderSlot: 0` on the tankiest member makes the \"rush or clear\"\n    // decision the point of the fight.\n    commander_demo: {\n      name: \"Goblin Commander Squad\",\n      playerTeam: [\"hunter\", \"pixie\", \"jack_frost\", \"oni\"],\n\n      enemyTeam: [\n        \"goblin_commander\",\n        \"goblin_soldier\",\n        \"goblin_mage\"\n      ],\n\n      commanderSlot: 0,\n\n      playerBonusPress: 0,\n      enemyBonusPress: 0\n    },\n\n    // One enemy, 1 base icon + 2 bonus = 3 per round against the party's 4.\n    // Same pressure as the squad above, from a single body — this is the\n    // pattern for any solo boss in the engine.\n    boss_press_test: {\n      name: \"Nue Commander — Extra Press\",\n      playerTeam: [\"hunter\", \"pixie\", \"jack_frost\", \"oni\"],\n\n      enemyTeam: [\"nue\"],\n\n      commanderSlot: 0,\n\n      playerBonusPress: 0,\n      enemyBonusPress: 2\n    }\n  }\n","scenes/combat_flow.lor":"// ============================================================================\n// GENERIC PURE-LORELINE COMBAT FLOW\n// ============================================================================\n//\n// Core engine is array/map based.\n// This text UI exposes 4 target slots and 8 skill slots.\n//\n\n// WHY A ROUTER BEAT\n//\n// Loreline drives the flow, so the engine cannot loop on its own: every action\n// must return to a beat that decides what happens next. CombatRouter is that\n// hub, re-entered after each resolved action, and it answers three questions in\n// priority order — is the battle over, is this side out of icons, whose turn is\n// it. Every other beat ends by jumping back here.\n\nbeat CombatRouter\n  checkBattleEnd()\n\n  if battleEnded\n    -> BattleEnd\n\n  if !hasPressTurns()\n    finishCurrentSide()\n    -> CombatRouter\n\n  if currentSide == \"player\"\n    -> PlayerTurn\n  else\n    -> EnemyTurn\n\n\n// The player's action menu. It always reprints the whole board first: in a\n// text UI there is no persistent HUD, and spending icons well requires seeing\n// HP, buff stages and the remaining icons at the moment of the decision.\n//\n// The 8 skill lines are static — a Loreline `choice` cannot be generated from\n// an array — so each is guarded by `currentSkillExists(n)` and simply\n// disappears for an actor with fewer skills.\n\nbeat PlayerTurn\n  $battlefieldStatus()\n\n  $turnHeader()\n\n  Available skills:\n  $currentSkillList()\n\n  choice\n    Skill 1 if currentSkillExists(0)\n      selectCurrentSkillSlot(0)\n      -> SkillSelected\n\n    Skill 2 if currentSkillExists(1)\n      selectCurrentSkillSlot(1)\n      -> SkillSelected\n\n    Skill 3 if currentSkillExists(2)\n      selectCurrentSkillSlot(2)\n      -> SkillSelected\n\n    Skill 4 if currentSkillExists(3)\n      selectCurrentSkillSlot(3)\n      -> SkillSelected\n\n    Skill 5 if currentSkillExists(4)\n      selectCurrentSkillSlot(4)\n      -> SkillSelected\n\n    Skill 6 if currentSkillExists(5)\n      selectCurrentSkillSlot(5)\n      -> SkillSelected\n\n    Skill 7 if currentSkillExists(6)\n      selectCurrentSkillSlot(6)\n      -> SkillSelected\n\n    Skill 8 if currentSkillExists(7)\n      selectCurrentSkillSlot(7)\n      -> SkillSelected\n\n    // PASS and Analyze are the two non-attacking plays, and they are what\n    // make the menu a decision rather than a damage picker: PASS trades half\n    // an icon for turn order, Analyze buys information for free.\n\n    PASS — manipulate Press Turns\n      performPass()\n      $battleLog\n      -> CombatRouter\n\n    Analyze affinities — free UI action\n      $enemyAnalysis()\n      -> PlayerTurn\n\n\n// Targeting is a second step, routed by the skill's own `target` field. The\n// re-check of `canUseSkill` matters: MP or liveness may have changed between\n// the moment the menu was drawn and the moment the player picked — nothing is\n// spent until a target is confirmed, and Cancel costs nothing.\n\nbeat SkillSelected\n  if !canUseSkill(currentActorId(), selectedSkill)\n    Cannot use $selectedSkill right now.\n    -> PlayerTurn\n\n  if selectedSkillTargetsSelf()\n    useSelectedOnSelf()\n    $battleLog\n    -> CombatRouter\n\n  if selectedSkillTargetsEnemy()\n    -> ChooseEnemyTarget\n\n  if selectedSkillTargetsAlly()\n    -> ChooseAllyTarget\n\n  Unsupported target mode for skill $selectedSkill.\n  -> PlayerTurn\n\n\n// Four fixed target slots, mirroring `maxActiveMenuSlots`. `teamSlotAlive`\n// greys out the dead and the empty; `teamSlotLabel` carries the HP readout and\n// the [COMMANDER] tag, so the player picks a target while seeing exactly what\n// the choice is worth.\n\nbeat ChooseEnemyTarget\n  choice\n    Enemy slot 1 — $teamSlotLabel(\"enemy\", 0) if teamSlotAlive(\"enemy\", 0)\n      useSelectedOn(teamSlotId(\"enemy\", 0))\n      $battleLog\n      -> CombatRouter\n\n    Enemy slot 2 — $teamSlotLabel(\"enemy\", 1) if teamSlotAlive(\"enemy\", 1)\n      useSelectedOn(teamSlotId(\"enemy\", 1))\n      $battleLog\n      -> CombatRouter\n\n    Enemy slot 3 — $teamSlotLabel(\"enemy\", 2) if teamSlotAlive(\"enemy\", 2)\n      useSelectedOn(teamSlotId(\"enemy\", 2))\n      $battleLog\n      -> CombatRouter\n\n    Enemy slot 4 — $teamSlotLabel(\"enemy\", 3) if teamSlotAlive(\"enemy\", 3)\n      useSelectedOn(teamSlotId(\"enemy\", 3))\n      $battleLog\n      -> CombatRouter\n\n    Cancel\n      -> PlayerTurn\n\n\nbeat ChooseAllyTarget\n  choice\n    Ally slot 1 — $teamSlotLabel(\"player\", 0) if teamSlotAlive(\"player\", 0)\n      useSelectedOn(teamSlotId(\"player\", 0))\n      $battleLog\n      -> CombatRouter\n\n    Ally slot 2 — $teamSlotLabel(\"player\", 1) if teamSlotAlive(\"player\", 1)\n      useSelectedOn(teamSlotId(\"player\", 1))\n      $battleLog\n      -> CombatRouter\n\n    Ally slot 3 — $teamSlotLabel(\"player\", 2) if teamSlotAlive(\"player\", 2)\n      useSelectedOn(teamSlotId(\"player\", 2))\n      $battleLog\n      -> CombatRouter\n\n    Ally slot 4 — $teamSlotLabel(\"player\", 3) if teamSlotAlive(\"player\", 3)\n      useSelectedOn(teamSlotId(\"player\", 3))\n      $battleLog\n      -> CombatRouter\n\n    Cancel\n      -> PlayerTurn\n\n\n// The enemy side plays with the same functions the player's menu calls — the\n// AI has no privileged resolution path, only its own decision function. The\n// board is reprinted here too so the player can watch their icon pool and\n// their HP change.\n\nbeat EnemyTurn\n  $battlefieldStatus()\n\n  $turnHeader()\n\n  enemyAct()\n  $battleLog\n\n  -> CombatRouter\n\n\n// The epilogue, and the payoff of the Commander design: a battle stopped by a\n// Commander kill is announced differently from an ordinary wipe, and the reward\n// summary spells out base XP, Overkill percentage and bonus separately so the\n// player can see which of their choices produced the number.\n\nbeat BattleEnd\n  if victor == \"player\"\n    if battleEndReason == \"commander_defeated\"\n      COMMANDER DEFEATED — battle ends immediately.\n    else\n      VICTORY.\n\n    $rewardSummary()\n\n  else if victor == \"enemy\"\n    DEFEAT.\n\n  else\n    ENGINE ERROR.\n    $battleLog\n\n  Final state:\n  $battlefieldStatus()\n\n  choice\n    Restart menu\n      -> Start\n\n    End\n      -> .\n"};window.__LRL_SOURCE="// ============================================================================\n// LORELINE PRESS TURN + COMMANDER ENGINE\n// Generic, data-driven combat prototype\n// ============================================================================\n//\n// LAYERING — the one rule of this project:\n//\n//   engine/  pure rules, no content. Never names a character, a skill or an\n//            encounter; every number it uses comes from data/.\n//   data/    all the content and all the tuning. Editing it changes the game;\n//            editing engine/ changes the game's laws.\n//   scenes/  the Loreline presentation shell — beats, choices, text. It only\n//            calls engine functions and interpolates their results.\n//\n// Import order is free: Loreline resolves functions at call time, and every\n// import shares one global namespace (which is also why two beats may never\n// share a name across files).\n//\n\nimport engine/state\nimport engine/press_turn\nimport engine/actors\nimport engine/skills\nimport engine/rewards\nimport engine/combat\nimport engine/ai\nimport engine/ui\n\nimport data/rules\nimport data/skills\nimport data/actors\nimport data/encounters\nimport data/registry\n\nimport scenes/combat_flow\n\n\n// Boot: load the content databases, then let the player pick a demo.\n//\n// The three `commander_demo` entries are the same encounter with three\n// different openings — that is the whole point of the menu: initiative decides\n// which side spends the first round's icons, and against an even squad that\n// single difference is felt for the entire fight.\n\nbeat Start\n  initializeDatabases()\n\n  PRESS TURN + COMMANDER ENGINE\n\n  Rules demonstrated here:\n  - Press Turn action economy\n  - Weak / Crit / Miss / Null / Repel / Drain / Pass\n  - AGI order and neutral initiative\n  - Smirk\n  - every enemy group can designate one Commander\n  - killing the Commander ends the battle immediately\n  - surviving enemies give no XP / reward\n  - Commander final HP can go negative on the killing blow\n  \"- Overkill % = negative HP / Commander max HP, capped at 100%\"\n\n  choice\n    Commander demo — Player Advantage\n      startEncounter(\"commander_demo\", \"player\")\n      -> CombatRouter\n\n    Commander demo — Neutral Initiative\n      startEncounter(\"commander_demo\", \"neutral\")\n      -> CombatRouter\n\n    Commander demo — Enemy Advantage\n      startEncounter(\"commander_demo\", \"enemy\")\n      -> CombatRouter\n\n    // Same rules, one enemy with bonus icons instead of three bodies — the\n    // solo-boss shape of the same action economy.\n\n    Boss extra-Press demo\n      startEncounter(\"boss_press_test\", \"player\")\n      -> CombatRouter\n\n    End\n      -> .\n";window.__LRL_FILEPATH="main.lor";window.__LRL_WAIT_FOR_CLICK=true;window.__LRL_AVAILABLE_LOCALES=[];window.__LRL_INITIAL_LOCALE=null;</script>
